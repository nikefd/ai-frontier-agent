services:
  ai-frontier:
    build: .
    container_name: ai-frontier-agent
    ports:
      # 本机回环调试入口；Coolify 部署时由其 Traefik 经容器网络反代（域名在 Coolify UI 配）
      - "127.0.0.1:9702:9702"
    volumes:
      - ai-frontier-data:/data
    environment:
      # 对话 agent + 抓取/翻译 worker 共用的 LLM（DeepSeek，OpenAI 兼容）；key 在 Coolify 配
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIF_LLM_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIF_LLM_BASE_URL: ${AIF_LLM_BASE_URL:-https://api.deepseek.com}
      AIF_LLM_MODEL: ${AIF_LLM_MODEL:-deepseek-chat}
      AIF_DATA_DIR: /data
      # 全天分时刷新；锚点错开 1 小时，为翻译留出处理窗口。
      AIF_SCHEDULER_ENABLED: ${AIF_SCHEDULER_ENABLED:-1}
      AIF_AI_NEWS_CRON_HOUR: ${AIF_AI_NEWS_CRON_HOUR:-5}
      AIF_AI_NEWS_CRON_MINUTE: ${AIF_AI_NEWS_CRON_MINUTE:-0}
      AIF_AI_NEWS_INTERVAL_HOURS: ${AIF_AI_NEWS_INTERVAL_HOURS:-4}
      AIF_SUMMARY_CRON_HOUR: ${AIF_SUMMARY_CRON_HOUR:-6}
      AIF_SUMMARY_CRON_MINUTE: ${AIF_SUMMARY_CRON_MINUTE:-0}
      AIF_SUMMARY_INTERVAL_HOURS: ${AIF_SUMMARY_INTERVAL_HOURS:-4}
      # 认证 / 防滥用配置必须显式透传；否则 Coolify 中设置同名变量也进不了容器。
      AIF_SECRET_KEY: ${AIF_SECRET_KEY:-}
      AIF_SESSION_MAX_AGE_DAYS: ${AIF_SESSION_MAX_AGE_DAYS:-30}
      AIF_COOKIE_SECURE: ${AIF_COOKIE_SECURE:-0}
      AIF_ADMIN_EMAIL: ${AIF_ADMIN_EMAIL:-}
      AIF_DAILY_LLM_LIMIT: ${AIF_DAILY_LLM_LIMIT:-50}
      AIF_CORS_ORIGINS: ${AIF_CORS_ORIGINS:-}
      AIF_SMTP_HOST: ${AIF_SMTP_HOST:-}
      AIF_SMTP_PORT: ${AIF_SMTP_PORT:-587}
      AIF_SMTP_USER: ${AIF_SMTP_USER:-}
      AIF_SMTP_PASSWORD: ${AIF_SMTP_PASSWORD:-}
      AIF_SMTP_FROM: ${AIF_SMTP_FROM:-}
      AIF_PUBLIC_BASE_URL: ${AIF_PUBLIC_BASE_URL:-}
      # 私有 rsshub：抓取时 rsshub.app 路由全改写到这个容器内地址，绕开公共实例限流/403
      AIF_RSSHUB_BASE: ${AIF_RSSHUB_BASE:-http://rsshub:1200}
      TZ: Asia/Shanghai
    depends_on:
      - rsshub
    restart: unless-stopped

  # 自建 RSSHub：把 Twitter 大V / GitHub / Anthropic 等 rsshub 路由从公共实例迁到私有实例。
  # 公共 rsshub.app 对 Twitter 路由 404、对 GitHub/Anthropic 路由 403；私有实例无此限制。
  rsshub:
    image: diygod/rsshub:latest
    container_name: ai-frontier-rsshub
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
      # Twitter 抓取需登录态 cookie（x.com 的 auth_token）。在 Coolify/服务器环境变量手填，
      # 不写进代码/git。留空则 Twitter 路由抓不到（其余路由仍正常）。
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    depends_on:
      - rsshub-redis
    restart: unless-stopped

  # rsshub 的缓存后端：减少对上游源的重复请求、降低被限流概率
  rsshub-redis:
    image: redis:alpine
    container_name: ai-frontier-rsshub-redis
    volumes:
      - rsshub-redis-data:/data
    restart: unless-stopped

volumes:
  # 命名卷：与部署目录解耦（Coolify 每次部署换工作目录，相对路径 bind mount 会丢数据）
  ai-frontier-data:
  rsshub-redis-data:
