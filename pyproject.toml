[project]
name = "ai-frontier-agent"
version = "0.1.0"
description = "可自托管的 AI 前沿信息站：分层信源、中文速报、实践卡与对话式追踪。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
    "pydantic-settings>=2.5",
    "python-dateutil>=2.9",
    "lxml>=5.3",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "agent*"]
