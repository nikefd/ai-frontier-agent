<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 前沿 Agent</title>
<link rel="stylesheet" href="/ui/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body data-agent="ai-news">
<header class="top">
  <h1 id="brand" title="返回首页"><span class="dot"></span> AI 前沿 Agent</h1>
  <div class="auth-slot" id="auth-slot"></div>
</header>

<main class="fluid">
  <div class="page-head">
    <div>
      <h2>🛰️ AI 前沿信息站</h2>
      <p class="lede">每天自动抓取 80+ 精选 AI 源 · 双语 · 按需深度解读</p>
    </div>
    <div class="row tight" style="flex:0 0 auto">
      <span class="pill" id="article-count">… 篇</span>
      <button class="primary" id="btn-fetch" title="手动抓取一次（覆盖今天的自动抓取）">
        <span id="fetch-icon">↻</span> 立即抓取
      </button>
    </div>
  </div>

  <div class="split-2">
    <!-- ───────── Sidebar ───────── -->
    <aside>
      <div class="side-nav">
        <div class="group">视图</div>
        <button class="on" data-view="feed"><span>📰</span> 文章流 <span class="count" id="cnt-feed">·</span></button>
        <button data-view="summary"><span>✨</span> 今日速报</button>
        <button data-view="dives"><span>🧠</span> 深度解读 <span class="count" id="cnt-dives">·</span></button>
        <button data-view="sources"><span>🔌</span> 数据源 <span class="count" id="cnt-sources">·</span></button>
      </div>

      <div class="side-nav mt-12">
        <div class="group">分类</div>
        <div class="seg tier-seg" id="cat-seg" style="flex-wrap:wrap;gap:4px;padding:6px 8px">
          <button class="on" data-cat="">全部</button>
          <button data-cat="vendor">🏢 官方</button>
          <button data-cat="expert">✍️ 专家</button>
          <button data-cat="x-ai">𝕏 大V</button>
          <button data-cat="community">🌐 社区</button>
          <button data-cat="media">📰 媒体</button>
          <button data-cat="paper">📄 论文</button>
          <button data-cat="trending">🔥 风向</button>
        </div>
      </div>
    </aside>

    <!-- ───────── Main column ───────── -->
    <section>

      <!-- VIEW: FEED (full-width cards) -->
      <div class="view-pane" id="view-feed">
        <div class="feed-cards">
          <div class="feed-toolbar feed-toolbar-top">
            <input id="search" placeholder="🔍 搜标题 / 摘要…" style="flex:1;min-width:240px" />
            <div class="seg">
              <button class="on" data-filter="all">全部</button>
              <button data-filter="pinned">📌 收藏</button>
              <button data-filter="translated">🌐 已译</button>
            </div>
            <button class="ghost sm" id="btn-translate" title="手动跑一轮翻译">🌐 批量翻译</button>
          </div>
          <div id="article-list" class="article-cards">
            <div class="muted-card">加载中…</div>
          </div>
          <div class="page-nav" id="page-nav">
            <span id="page-info">—</span>
            <div class="nav-btns">
              <button id="btn-prev">‹ 上一页</button>
              <button id="btn-next">下一页 ›</button>
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW: SUMMARY -->
      <div class="view-pane hidden" id="view-summary">
        <div class="card">
          <div class="card-head">
            <h3>✨ 今日 AI 速报</h3>
            <div class="actions">
              <span id="summary-meta" class="text-xs text-faint"></span>
              <button class="primary sm" id="btn-regen-summary">重新生成</button>
            </div>
          </div>
          <div id="summary-cohort" class="text-sm text-dim mb-12"></div>
          <div id="summary-body" class="reader" style="max-height:none"></div>
        </div>
      </div>

      <!-- VIEW: DEEP DIVES (independent reading library) -->
      <div class="view-pane hidden" id="view-dives">
        <div class="card">
          <div class="card-head">
            <h3>🧠 深度解读</h3>
            <span class="text-xs text-faint">你生成 / 收下的解读集中在这里读和管理 · 不随文章流淘汰</span>
          </div>
          <div class="row">
            <label class="field">
              <span>手动新建 · 主题 / 标题</span>
              <input id="dive-topic" placeholder="例：DSPy 自动 prompt 优化原理与上手" />
            </label>
            <button class="primary fixed" id="btn-new-dive" style="align-self:flex-end">⚡ 生成解读</button>
          </div>
          <div id="dive-status" class="text-xs text-faint mt-8"></div>
          <hr class="hr">
          <div id="dives-list"></div>
        </div>
      </div>

      <!-- VIEW: SOURCES -->
      <div class="view-pane hidden" id="view-sources">
        <div class="card">
          <div class="card-head">
            <h3>🔌 数据源状态</h3>
            <span class="text-xs text-faint">每天一次定时抓取 · 每源最多 4 篇 · 全局 150 篇封顶</span>
          </div>
          <div id="sources-list"></div>
        </div>
      </div>

    </section>
  </div>
</main>

<!-- ───────── Agent chat (sparrow-chat official component) ───────── -->
<script src="/ui/js/sparrow-chat.js"></script>
<script>
  SparrowChat.mount({
    endpoint: '/api/agent/chat',
    conversationsApi: '/api/agent/conversations',
    title: '💬 AI 助理',
    hint: '我能查文章/数据源/追踪主题，并帮你建追踪主题、收藏文章。试试「帮我盯住 RAG 进展」。',
    accent: '#7c3aed',
    storageKey: 'aif_conv_id',
    i18n: {
      send: '发送',
      placeholder: '帮我查查最近的 Agent 进展…',
      history: '历史会话',
      newChat: '新对话',
      resize: '放大 / 缩小',
      close: '收起',
      back: '返回',
      thinking: '思考中',
      emptyNew: '开始一段新对话，或点 🕘 查看历史。',
      newStarted: '新对话已开始 ✨',
      loading: '加载中…',
      noConversations: '还没有历史会话。',
      loadFailed: '加载失败。',
      emptyConversation: '这个会话还没有消息。',
      sources: '来源',
      messages: '条',
      untitled: '新对话',
      del: '删除',
      justNow: '刚刚',
      minAgo: ' 分钟前',
      hourAgo: ' 小时前',
      dayAgo: ' 天前',
    },
  });
</script>
<script type="module" src="/ui/js/main.js"></script>
</body>
</html>
