name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error "$release/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
      - name: Scan complete available history with redacted output
        run: >-
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history"
          --redact=100 --ignore-gitleaks-allow --no-banner --no-color "$GITHUB_WORKSPACE"
